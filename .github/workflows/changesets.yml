name: Changesets

on:
  schedule:
    - cron: '0 0 * * *'

  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  YARN_NPM_PUBLISH_PROVENANCE: 'true'

jobs:
  # Update package versions from changesets.
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'verdaccio/yarn-plugin-npm'
    steps:
      - name: checkout code repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
      - name: enable corepack
        run: corepack enable
      - name: install dependencies
        run: yarn install
      - name: build
        run: yarn build
      - name: create versions
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          version-script: yarn ci:version
          commit-message: 'build: release packages'
          pr-title: 'build: release packages'
          publish-script: yarn ci:publish
          create-github-releases: true
        env:
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
