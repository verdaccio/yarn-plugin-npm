name: Changesets

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  CI: true
  NPM_CONFIG_PROVENANCE: 'true'

jobs:
  # Open or update the version PR on every push to master.
  version:
    timeout-minutes: 14
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'verdaccio/yarn-plugin-npm'
    outputs:
      hasChangesets: ${{ steps.changesets.outputs['has-changesets'] }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
      - name: enable corepack
        run: corepack enable
      - name: install dependencies
        run: yarn install
      - name: build
        run: yarn build
      - name: create versions
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          version-script: yarn ci:version
          commit-message: 'build: release packages'
          pr-title: 'build: release packages'
          create-github-releases: true

  # Publish after the version PR merges, using the npm environment's protection rules.
  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    timeout-minutes: 14
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: checkout code repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
      - name: enable corepack
        run: corepack enable
      - name: install dependencies
        run: yarn install
      - name: build
        run: yarn build
      - name: publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESET_RELEASE_TOKEN }}
          publish-script: yarn ci:publish
          create-github-releases: true
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
